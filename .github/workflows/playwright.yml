name: Playwright Tests

# MANUAL ONLY — runs only when you click "Run workflow" from the Actions tab.
#
# Deliberately does NOT run on push or pull_request: the org's GitHub Actions
# minutes are limited, so this workflow never triggers itself. Trigger it by
# hand when you actually want a run.
#
# To re-enable automatic runs later, add back:
#   push:         { branches: [main] }
#   pull_request: { branches: [main] }
#   schedule:     [{ cron: "30 2 * * *" }]   # nightly 02:30 UTC
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      # Both the preflight below and Playwright read this, so a staging URL
      # only has to be set in one place. Add a repository variable named
      # BASE_URL to point the whole run somewhere else.
      BASE_URL: ${{ vars.BASE_URL || 'https://cosmoscitizenapp-b3h4dqh7bte2ezdw.southindia-01.azurewebsites.net' }}
    steps:
      - uses: actions/checkout@v4

      # Fail in one minute instead of twenty, and warm the app up.
      #
      # Azure App Service cold start: if nothing has hit the site for a while
      # the first request can take 15+ seconds while the container spins up,
      # which is long enough to look like a hang. One throwaway request here
      # means the first real test meets a warm app.
      #
      # No credential check, unlike the CosmoSmart 2.0 suite — every test here
      # runs signed out, because the portal's only way in is a one-time code
      # sent to a real inbox or phone. See playwright.config.ts.
      - name: Preflight - site reachable
        run: |
          reachable=no
          for attempt in 1 2 3; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL/auth" || true)"
            if [ -z "$code" ]; then code=000; fi
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" != "000" ]; then reachable=yes; break; fi
            sleep 5
          done

          if [ "$reachable" = "no" ]; then
            {
              echo "## 🚫 The citizen portal could not be reached — no tests were run"
              echo
              echo "\`$BASE_URL\` did not answer this runner at all."
              echo
              echo "Check the Azure App Service is running and has not been stopped"
              echo "or scaled to zero."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$BASE_URL unreachable - no tests were run"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only. The suite tests the portal's own behaviour rather than
      # browser-specific rendering, so a second engine would double the run
      # time for very little. Add `firefox webkit` here and matching projects
      # in playwright.config.ts if cross-browser coverage is wanted later.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      # Results are read straight off the run page: the `github` reporter
      # annotates failures inline, and reporters/github-summary.ts writes a
      # pass/fail table into the job summary. These artifacts are for digging
      # into a failure afterwards.
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        # Never fail the job over an artifact upload. If the account's storage
        # quota is full the action errors, and without this a run where every
        # test passed would be reported as broken.
        continue-on-error: true
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Screenshots and traces of failed runs.
      - name: Upload failure traces
        uses: actions/upload-artifact@v4
        # Same reasoning as above: a full quota must not turn a run red.
        continue-on-error: true
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 30
